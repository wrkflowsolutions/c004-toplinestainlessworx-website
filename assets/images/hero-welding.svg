<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stainless steel fabrication workshop placeholder">
  <defs>
    <radialGradient id="arc" cx="32%" cy="72%" r="42%">
      <stop offset="0" stop-color="#FF6B1A" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FF8a3a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF6B1A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="0.6" stop-color="#0F0F0F"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <pattern id="grain" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="46" height="46" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="46" stroke="#ffffff" stroke-opacity="0.018" stroke-width="22"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <!-- faint structural beams -->
  <g stroke="#C0C0C0" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="220" x2="1600" y2="160"/>
    <line x1="0" y1="680" x2="1600" y2="740"/>
    <line x1="420" y1="0" x2="520" y2="900"/>
    <line x1="1180" y1="0" x2="1080" y2="900"/>
  </g>
  <!-- welding arc glow -->
  <rect width="1600" height="900" fill="url(#arc)"/>
  <circle cx="512" cy="648" r="6" fill="#FFD9A0"/>
  <circle cx="512" cy="648" r="14" fill="#FF6B1A" fill-opacity="0.35"/>
</svg>
